<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#0d1024">
  <meta name="description" content="Tiger VPN — تمام لینک‌های شبکه‌های اجتماعی در یک جا">

  <title>Tiger VPN | شبکه‌های اجتماعی</title>

  <!-- PWA & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="floating-controls">
    <button class="ctrl-btn glass" id="themeToggle" data-i18n-title="themeTitle" title="تغییر تم">
      <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <button class="ctrl-btn glass" id="langToggle" data-i18n-title="langTitle" title="تغییر زبان">
      <span id="langLabel">EN</span>
    </button>
  </div>

  <header class="header">
    <div class="logo-wrap">
      <img src="assets/logo.png" alt="Tiger VPN" class="logo-img" id="brandLogo">
      <span class="logo-emoji" id="brandFallback" style="display:none">🐯</span>
      <span class="brand-name text-gradient" data-i18n="brand">TIGER VPN</span>
    </div>
    <p class="brand-sub" data-i18n="brandSub">همه‌ی راه‌های ارتباط با ما در یک جا</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="search" data-i18n-placeholder="searchPlaceholder" placeholder="جستجوی شبکه اجتماعی...">
      <span class="search-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
      </span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="all" data-i18n="filterAll">همه</button>
      <button class="tab" data-filter="channel" data-i18n="filterChannel">کانال‌ها</button>
      <button class="tab" data-filter="support" data-i18n="filterSupport">پشتیبانی</button>
      <button class="tab" data-filter="social" data-i18n="filterSocial">شبکه‌های اجتماعی</button>
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <footer class="footer">
    <span data-i18n="footer">ساخته شده با ♥ برای کاربران Tiger VPN</span>
  </footer>

  <div class="toast" id="toast">
    <span id="toastText">✓ لینک کپی شد</span>
  </div>

  <!-- مودال نمایش QR کد -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal-content glass">
      <button class="close-btn" id="closeModal">×</button>
      <h3 id="qrTitle" style="margin-bottom: 15px; font-size: 18px;">اسکن کنید</h3>
      <div class="qr-wrapper">
        <img id="qrImage" src="" alt="QR Code">
      </div>
      <p id="qrLinkText" class="qr-link" dir="ltr"></p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
